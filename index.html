<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5574">
<meta name="robots" content="noindex, nofollow">
<title>RIAC — protótipo de redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f0eee8; --line:#e3e0d7; --line-2:#d3cfc3;
  --ink:#122033; --ink-2:#33445a; --muted:#64748a;
  --primary:#0b5574; --primary-600:#094a66; --primary-50:#e7f1f5; --primary-100:#cfe3ec;
  --green:#1d7a5f; --green-50:#e5f3ee; --amber:#a8650b; --amber-50:#fbf1e1; --red:#b3362f; --red-50:#fbeceb;
  --violet:#5866c4; --violet-50:#eceefb;
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sh-1:0 1px 2px rgba(18,32,51,.05),0 1px 1px rgba(18,32,51,.03);
  --sh-2:0 6px 24px -8px rgba(18,32,51,.16),0 2px 6px rgba(18,32,51,.05);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Fraunces",Georgia,serif;
  --fs:16px;
}
html.hc{ --bg:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#222; --line-2:#000; --ink:#000; --ink-2:#000; --muted:#222; --primary:#003a57; --primary-600:#002a40; --primary-50:#e0eef5; }
*{box-sizing:border-box}
html{font-size:var(--fs); scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{animation:none!important;transition:none!important} }
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:0}
a{color:var(--primary);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main:focus{outline:none}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-family:var(--display);font-weight:500;font-size:clamp(2rem,4.4vw,3.1rem);letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,2.6vw,2rem)}
h3{font-size:1.08rem;font-weight:650}
p{margin:0 0 1em}
.muted{color:var(--muted)} .small{font-size:.875rem} .xs{font-size:.78rem}
.eyebrow{font-size:.78rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}

/* Barra de protótipo */
.proto{background:#16263a;color:#d7e2ee;font-size:.8rem;text-align:center;padding:6px 12px}
.proto b{color:#fff}

/* Topo */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff}
.brand .t1{font-size:1.15rem;letter-spacing:.04em;line-height:1}
.brand .t2{font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:0;line-height:1.2}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a{padding:8px 12px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-weight:550;font-size:.93rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--primary-50);color:var(--primary)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.a11y{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.a11y button{background:none;border:0;padding:6px 10px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--ink-2)}
.a11y button+button{border-left:1px solid var(--line)}
.a11y button:hover{background:var(--surface-2)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;border:1px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--primary);color:#fff} .btn.pri:hover{background:var(--primary-600)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)} .btn.sec:hover{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--primary);padding:8px 10px}
.btn.ghost:hover{background:var(--primary-50)}
.btn.danger{background:var(--surface);border-color:#e6bdb9;color:var(--red)}
.btn.sm{padding:7px 12px;font-size:.86rem;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* Hero */
.hero{background:linear-gradient(180deg,#eaf2f4 0%,var(--bg) 100%);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero .wrap{padding-top:56px;padding-bottom:44px;position:relative;z-index:1}
.hero svg.waves{position:absolute;right:-40px;bottom:-10px;width:620px;opacity:.55;z-index:0}
.hero p.lead{font-size:1.12rem;color:var(--ink-2);max-width:560px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.search{position:relative;max-width:720px}
.search input{width:100%;height:60px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);padding:0 130px 0 52px;font-size:1.05rem;box-shadow:var(--sh-2)}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-100),var(--sh-2)}
.search .ic.lead{position:absolute;left:18px;top:20px;color:var(--muted)}
.search .btn{position:absolute;right:8px;top:8px;height:44px}
.suggest{position:absolute;left:0;right:0;top:66px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);z-index:30;overflow:hidden}
.suggest a{display:flex;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.suggest a:first-child{border-top:0}
.suggest a:hover,.suggest a.on{background:var(--primary-50)}
.suggest .tag{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer;color:var(--ink-2);text-decoration:none}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Ações rápidas */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-28px;position:relative;z-index:2}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-decoration:none;color:var(--ink);box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s}
.qa:hover{border-color:var(--primary);box-shadow:var(--sh-2);transform:translateY(-2px)}
.qa .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.qa b{font-size:1.02rem}
.qa span{font-size:.86rem;color:var(--muted)}

/* Secções */
section.blk{padding:52px 0}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.head p{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh-1)}
.card.link{text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.card.link:hover{border-color:var(--primary);box-shadow:var(--sh-2)}
.card h3 a{color:inherit;text-decoration:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.on{background:var(--green-50);color:var(--green)}
.tag.warn{background:var(--amber-50);color:var(--amber)}
.tag.off{background:var(--red-50);color:var(--red)}
.tag.blue{background:var(--primary-50);color:var(--primary)}
.tag.vio{background:var(--violet-50);color:var(--violet)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

.svc{display:flex;flex-direction:column;gap:10px;height:100%}
.svc .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.theme{display:flex;gap:14px;align-items:flex-start}
.theme .ico{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--primary);flex:none}

.event{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.event:hover{border-color:var(--violet)}
.event .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--violet-50);color:var(--violet);flex:none}

/* Espera ao vivo */
.live{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.waitrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.waitrow:first-of-type{border-top:0}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(29,122,95,.5);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(29,122,95,0)}100%{box-shadow:0 0 0 0 rgba(29,122,95,0)}}

/* Canais */
.channels{background:var(--ink);color:#e6edf5;border-radius:var(--r-lg);padding:32px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:24px}
.channels h2{color:#fff}
.channels .ch{border-left:1px solid rgba(255,255,255,.14);padding-left:20px}
.channels a{color:#fff}
.channels .big{font-size:1.5rem;font-weight:700;color:#fff;text-decoration:none;display:block;margin:4px 0}

/* Página interna */
.crumbs{font-size:.85rem;color:var(--muted);padding:18px 0 0}
.crumbs a{color:var(--muted)}
.pagehead{padding:18px 0 26px;border-bottom:1px solid var(--line);margin-bottom:28px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.sticky{position:sticky;top:88px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-color:var(--primary)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary)}
.check.done{background:var(--green-50);border-color:#bfe0d4}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--green);transition:width .3s}
.price{font-size:2.4rem;font-weight:700;letter-spacing:-.02em;font-family:var(--display)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted);font-size:.88rem} dl.kv dd{margin:0;font-weight:550}

/* Formulários */
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;height:48px;border:1px solid var(--line-2);border-radius:11px;padding:0 14px;background:var(--surface)}
textarea.inp{height:auto;padding:12px 14px;min-height:110px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-100)}
.field{margin-bottom:16px}
.hint{font-size:.8rem;color:var(--muted);margin-top:5px}
.err{font-size:.82rem;color:var(--red);margin-top:5px}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.radio:has(input:checked){border-color:var(--primary);background:var(--primary-50)}
.radio input{accent-color:var(--primary);width:18px;height:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}

/* Stepper */
.steps{display:flex;gap:6px;margin:0 0 26px;padding:0;list-style:none;counter-reset:s}
.steps li{flex:1;counter-increment:s;font-size:.82rem;font-weight:600;color:var(--muted)}
.steps li::before{content:"";display:block;height:4px;border-radius:99px;background:var(--line);margin-bottom:8px}
.steps li.on{color:var(--ink)} .steps li.on::before{background:var(--primary)}
.steps li.done::before{background:var(--green)}

/* Lista de lojas */
.storelist{display:grid;gap:10px}
.store{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.store:hover{border-color:var(--primary)}
.store.sel,.store[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.store .pin{width:38px;height:38px;border-radius:10px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;flex:none}
.store h4{margin:0 0 2px;font-size:1rem}
#map{height:560px;border-radius:var(--r);border:1px solid var(--line);background:#dfe9ee}
.mapwrap{display:grid;grid-template-columns:420px 1fr;gap:16px}
.mapwrap .storelist{max-height:560px;overflow:auto;padding-right:4px}

/* Calendário */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal .mh b{font-size:1.05rem;text-transform:capitalize}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:.75rem;color:var(--muted);font-weight:600;padding-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.cal td{padding:3px;text-align:center}
.day{width:100%;aspect-ratio:1/1;max-height:54px;border-radius:11px;border:1px solid transparent;background:none;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.95rem}
.day:hover:not([disabled]){border-color:var(--primary)}
.day[disabled]{color:#b6b9bd;cursor:not-allowed;font-weight:500}
.day .av{width:6px;height:6px;border-radius:50%}
.day.today{box-shadow:inset 0 0 0 1px var(--line-2)}
.day[aria-pressed="true"]{background:var(--primary);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend span{display:flex;gap:6px;align-items:center}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover:not([disabled]){border-color:var(--primary);color:var(--primary)}
.slot[disabled]{text-decoration:line-through;color:#b6b9bd;background:var(--surface-2);cursor:not-allowed;border-color:var(--line)}
.slot[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Senha */
.ticket{background:var(--surface);border-radius:24px;border:1px solid var(--line);box-shadow:var(--sh-2);overflow:hidden;max-width:440px;margin:0 auto}
.ticket .tt{background:var(--primary);color:#fff;padding:22px 24px}
.ticket .num{font-family:var(--display);font-size:5rem;font-weight:500;line-height:1;letter-spacing:-.02em;margin:8px 0}
.ticket .tb{padding:22px 24px}
.ticket .perf{height:0;border-top:2px dashed var(--line-2);margin:0 18px;position:relative}
.ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.ticket .perf::before{left:-30px}.ticket .perf::after{right:-30px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat div{background:var(--surface-2);border-radius:12px;padding:12px 6px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.qr{width:112px;height:112px;display:block}
.callnow{background:var(--green);color:#fff;border-radius:14px;padding:16px;text-align:center;font-weight:600;animation:glow 1.6s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(29,122,95,.4)}to{box-shadow:0 0 0 10px rgba(29,122,95,0)}}
.queues{display:grid;gap:10px}
.queue{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;width:100%;text-align:left}
.queue:hover{border-color:var(--primary)}
.queue .letter{width:46px;height:46px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}

/* Área pessoal */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 18px 28px}
.timeline li::before{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--line-2)}
.timeline li::after{content:"";position:absolute;left:11px;top:20px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline li.done::before{background:var(--green)}
.timeline li.cur::before{background:var(--primary);box-shadow:0 0 0 4px var(--primary-100)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--amber-50);color:#6d4206;border:1px solid #f0d6a8}
.alert.info{background:var(--primary-50);color:var(--primary-600);border-color:var(--primary-100)}
.alert.ok{background:var(--green-50);color:#165c47;border-color:#bfe0d4}

/* Rodapé */
footer{background:#0f1b2b;color:#aebccc;margin-top:40px;padding:48px 0 100px;font-size:.9rem}
footer a{color:#dbe5ef;text-decoration:none} footer a:hover{text-decoration:underline}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
footer h4{color:#fff;font-size:.95rem;margin-bottom:12px}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}

/* Assistente */
.fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 18px;display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer;box-shadow:var(--sh-2)}
.chat{position:fixed;right:22px;bottom:84px;width:380px;max-width:calc(100vw - 24px);height:540px;max-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px -10px rgba(18,32,51,.35);z-index:60;display:flex;flex-direction:column;overflow:hidden}
.chat header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:.92rem}
.msg.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat form input{flex:1;height:44px;border:1px solid var(--line-2);border-radius:11px;padding:0 12px}

/* Toast e modal */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:80;box-shadow:var(--sh-2);font-weight:500;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(15,27,43,.45);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;max-width:520px;width:100%;padding:26px;box-shadow:var(--sh-2);max-height:90vh;overflow:auto}

/* Navegação inferior (mobile) */
.bnav{display:none}

@media (max-width:1020px){
  .nav{display:none}
  .quick{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
  .layout{grid-template-columns:1fr} .sticky{position:static}
  .live{grid-template-columns:1fr}
  .channels{grid-template-columns:1fr 1fr}
  .channels .ch:nth-child(3){border-left:0;padding-left:0}
  .mapwrap{grid-template-columns:1fr} #map{height:360px} .mapwrap .storelist{max-height:none}
  footer .cols{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .top .wrap{height:60px}
  .brand .t2{display:none}
  .a11y{display:none}
  .hero .wrap{padding-top:34px;padding-bottom:40px}
  .hero svg.waves{width:380px;opacity:.35}
  .search input{height:54px;padding-right:16px;font-size:1rem}
  .search .btn{display:none}
  .hero .chips{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-bottom:4px;scrollbar-width:none}
  .hero .chips .chip{white-space:nowrap}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .quick{gap:10px}
  .qa{padding:14px} .qa span{display:none}
  section.blk{padding:36px 0}
  .head{flex-direction:column;align-items:flex-start}
  .channels{grid-template-columns:1fr;padding:24px}
  .channels .ch{border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.14);padding-top:16px}
  footer .cols{grid-template-columns:1fr}
  .fab{bottom:80px;right:14px;padding:12px}
  .fab span{display:none}
  .chat{right:12px;bottom:140px;height:calc(100vh - 220px)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:45;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0}
  .bnav a[aria-current="page"]{color:var(--primary)}
  .toast{bottom:84px}
  .ticket .num{font-size:4rem}
}

const isHoliday = d => FERIADOS.includes(ymd(d));
const rangesFor = (loja, d) => isHoliday(d) ? null : loja.h.d[d.getDay()];

function openStatus(loja, now = azNow()) {
  const m = now.getHours() * 60 + now.getMinutes();
  const r = rangesFor(loja, now);
  if (r) {
    for (const [a, b] of r) if (m >= a && m < b) return { open: true, label: `Aberta · fecha às ${fmtMin(b)}`, closeIn: b - m };
    const next = r.find(([a]) => a > m);
    if (next) return { open: false, label: `Pausa · reabre às ${fmtMin(next[0])}` };
  }
  for (let i = 1; i <= 8; i++) {
    const d = new Date(now); d.setDate(d.getDate() + i);
    const rr = rangesFor(loja, d);
    if (rr) return { open: false, label: `Fechada · abre ${i === 1 ? "amanhã" : DIAS[d.getDay()].toLowerCase()} às ${fmtMin(rr[0][0])}` };
  }
  return { open: false, label: "Fechada" };
}
const BIG = ["pdl","parque","angra","praia","horta","rgrande","pdl-riae","madalena","velas"];
const PER = { A: 7, B: 5, C: 3, D: 12, E: 15 };
function waitFor(loja, fila) {
  const st = openStatus(loja);
  const block = Math.floor(Date.now() / 300000);
  const n = 10 + Math.floor(rnd(loja.id + fila + "n") * 40) + (block % 30);
  const served = fila + pad(n, 3);
  if (!st.open) return { closed: true, served, ahead: 0, mins: 0, st };
  const base = rnd(loja.id + fila + block);
  const ahead = Math.round(base * (BIG.includes(loja.id) ? 12 : 5));
  return { closed: false, served, ahead, mins: ahead * PER[fila], st, next: n + ahead + 1 };
}
const avgWait = loja => { const w = ["A","B","C"].map(f => waitFor(loja, f)); return w[0].closed ? null : Math.round(w.reduce((s, x) => s + x.mins, 0) / 3); };
const filasFor = loja => loja.riae ? ["A","B","C","D","E"] : ["A","B","C","D"];

/* ===================== AGENDA: DISPONIBILIDADE ===================== */
function slotsFor(loja, date) {
  const r = rangesFor(loja, date); if (!r) return [];
  const now = azNow(); const today = ymd(now) === ymd(date); const nowM = now.getHours() * 60 + now.getMinutes();
  const dayLoad = 0.15 + rnd(loja.id + ymd(date)) * 0.8;
  const out = [];
  for (const [a, b] of r) for (let t = a; t + 20 <= b; t += 20) {
    const taken = rnd(loja.id + ymd(date) + t) < dayLoad || (today && t < nowM + 30);
    const own = S.bookings.some(x => x.status !== "cancelada" && x.loja === loja.id && x.date === ymd(date) && x.time === t);
    out.push({ t, free: !taken && !own });
  }
  return out;
}
function dayAvail(loja, date) {
  const now = azNow(); const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const max = new Date(start); max.setDate(max.getDate() + 60);
  if (date < start || date > max) return "out";
  const s = slotsFor(loja, date); if (!s.length) return "closed";
  const f = s.filter(x => x.free).length / s.length;
  return f === 0 ? "full" : f < 0.25 ? "few" : "many";
}

const modeTags = s => `<div class="tags">${s.modos.includes("online") ? `<span class="tag blue">${I("laptop","sm")}Online</span>` : ""}${s.modos.includes("agendar") ? `<span class="tag vio">${I("calendar","sm")}Com marcação</span>` : ""}${s.modos.includes("presencial") ? `<span class="tag">${I("ticket","sm")}Senha na loja</span>` : ""}</div>`;

function searchSvc(q, pub) {
  const n = norm(q).trim(); if (!n) return [];
  return SERVICOS.filter(s => !pub || s.pub === pub || n.length > 2)
    .map(s => { const t = norm(s.nome + " " + temaById(s.tema).nome + " " + s.resumo); const sc = norm(s.nome).includes(n) ? 3 : t.includes(n) ? 1 : n.split(" ").every(w => t.includes(w)) ? 1 : 0; return [s, sc]; })
    .filter(x => x[1]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function bindSearch(input, box, pub) {
  let idx = -1, res = [];
  const draw = () => {
    res = searchSvc(input.value, pub()).slice(0, 6);
    if (!input.value.trim()) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = res.length ? res.map((s, i) => `<a href="#/servico/${s.id}" class="${i === idx ? "on" : ""}" role="option">${I(temaById(s.tema).ic)}<span><b>${esc(s.nome)}</b><br><span class="xs muted">${esc(temaById(s.tema).nome)}</span></span>${s.modos.includes("online") ? `<span class="tag blue tag">Online</span>` : ""}</a>`).join("")
      : `<div style="padding:16px" class="small muted">Sem resultados para «${esc(input.value)}». Experimente outra palavra ou <a href="#/contactos">fale connosco</a>.</div>`;
  };
  input.addEventListener("input", () => { idx = -1; draw(); });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { idx = Math.min(res.length - 1, idx + 1); draw(); e.preventDefault(); }
    if (e.key === "ArrowUp") { idx = Math.max(-1, idx - 1); draw(); e.preventDefault(); }
    if (e.key === "Enter") { e.preventDefault(); if (idx >= 0 && res[idx]) go("#/servico/" + res[idx].id); else go("#/servicos?q=" + encodeURIComponent(input.value)); }
    if (e.key === "Escape") box.hidden = true;
  });
  document.addEventListener("click", e => { if (!box.contains(e.target) && e.target !== input) box.hidden = true; });
}
function islandSelect(id, val, all = true) {
  return `<select class="inp" id="${id}" aria-label="Ilha">${all ? `<option value="">Todas as ilhas</option>` : ""}${ILHAS.map(i => `<option ${i === val ? "selected" : ""}>${i}</option>`).join("")}</select>`;
}
function sortByDistance(list, pos) {
  const d = l => Math.hypot(l.lat - pos.lat, (l.lng - pos.lng) * Math.cos(pos.lat * Math.PI / 180));
  return [...list].map(l => ({ ...l, km: Math.round(d(l) * 111) })).sort((a, b) => a.km - b.km);
}
let MYPOS = null;
function locate(cb) {
  if (!navigator.geolocation) { toast("O seu navegador não permite obter a localização."); return; }

}

    app().innerHTML = `<div class="wrap" style="max-width:520px;padding-top:28px;padding-bottom:40px">

      </div>
      ${t.status === "ativa" ? `<div class="card" style="margin-top:16px">
        <label class="check" style="margin:0 0 12px;border:0;padding:0"><input type="checkbox" id="al" ${t.alert ? "checked" : ""}><span><b>Avisar-me quando faltarem 3 pessoas</b><br><span class="small muted">Notificação neste dispositivo</span></span></label>
        <div class="row"><a class="btn sec" href="${mapsUrl(l)}" target="_blank" rel="noopener">${I("nav","sm")}Como chegar</a><button class="btn danger" id="cx">${I("x","sm")}Cancelar senha</button></div></div>
        <p class="xs muted" style="text-align:center;margin-top:12px">Demonstração: a fila avança de forma acelerada (uma pessoa a cada 6 segundos).</p>` : `<div class="row" style="justify-content:center;margin-top:16px"><a class="btn pri" href="#/senha">Tirar nova senha</a></div>`}
      ${t.ahead === 0 && t.status === "ativa" ? `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn sec" id="fin">${I("check","sm")}Fui atendido</button></div>` : ""}
    </div>`;
    const al = $("#al"); if (al) al.onchange = () => { t.alert = al.checked; save(); };
    const cx = $("#cx"); if (cx) cx.onclick = async () => { if (await confirmBox("Cancelar a senha?", `A senha ${t.num} será libertada e perde a sua posição na fila.`, "Cancelar senha", true)) { t.status = "cancelada"; save(); toast("Senha cancelada."); render(); } };
    const fin = $("#fin"); if (fin) fin.onclick = () => { t.status = "concluída"; save(); rateModal(l); render(); };
  };
  render();
  if (t.status === "ativa" && t.ahead > 0) timers.push(setInterval(() => {
    if (t.ahead > 0) { t.ahead--; t.served = t.fila + pad(parseInt(t.num.slice(1)) - t.ahead - 1, 3); save(); render();

      if (t.ahead === 0) { toast(`É a sua vez: ${t.num}`); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} clearTimers(); } }
  }, 6000));
}

  function nextFree(l) {
    const n = azNow(); for (let i = 0; i < 30; i++) { const d = new Date(n.getFullYear(), n.getMonth(), n.getDate() + i); const s = slotsFor(l, d).find(x => x.free); if (s) return (i === 0 ? "hoje" : i === 1 ? "amanhã" : `${d.getDate()}/${d.getMonth() + 1}`) + " " + fmtMin(s.t); } return null;

  function stepD() {
    const l = lojaById(st.loja); const now = azNow();

    const m = st.month, first = (m.getDay() + 6) % 7, days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const minM = new Date(now.getFullYear(), now.getMonth(), 1), maxM = new Date(now.getFullYear(), now.getMonth() + 2, 1);
    let cells = ""; for (let i = 0; i < first; i++) cells += "<td></td>";
    for (let dd = 1; dd <= days; dd++) {
      const d = new Date(m.getFullYear(), m.getMonth(), dd), a = dayAvail(l, d), k = ymd(d);

      const dis = !["many","few"].includes(a);
      cells += `<td><button class="day ${k === ymd(now) ? "today" : ""}" data-d="${k}" ${dis ? "disabled" : ""} aria-pressed="${st.date === k}" aria-label="${fmtDate(d)}${a === "full" ? ", esgotado" : a === "few" ? ", poucas vagas" : a === "many" ? ", com vagas" : ", indisponível"}">${dd}${col && !dis ? `<span class="av" style="background:${st.date === k ? "#fff" : col}"></span>` : a === "full" ? `<span class="av" style="background:var(--line-2)"></span>` : ""}</button></td>`;

        <div class="card"><h3 style="text-transform:none">${st.date ? fmtDate(parseYmd(st.date)) : "Escolha um dia"}</h3>
          ${st.date ? `<p class="small muted">${slots.filter(s => s.free).length} horários livres · atendimento de 20 min · hora dos Açores</p>
          ${["Manhã","Tarde","Noite"].map((lab, i) => { const ss = slots.filter(s => i === 0 ? s.t < 780 : i === 1 ? s.t >= 780 && s.t < 1080 : s.t >= 1080); return ss.length ? `<p class="xs muted" style="margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">${lab}</p><div class="slots">${ss.map(s => `<button class="slot" data-t="${s.t}" ${s.free ? "" : "disabled"} aria-pressed="${st.time === s.t}">${fmtMin(s.t)}</button>`).join("")}</div>` : ""; }).join("")}` : `<p class="muted small">Os dias com vagas estão assinalados a verde.</p>`}
          <button class="btn pri block" id="nx" style="margin-top:18px" ${st.time == null ? "disabled" : ""}>Continuar ${I("arrow","sm")}</button></div>
      </div>`;
    bindBack();
    $("#pm").onclick = () => { st.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); stepD(); };
    $("#nm").onclick = () => { st.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); stepD(); };
    $(".cal tbody").onclick = e => { const b = e.target.closest("[data-d]"); if (b && !b.disabled) { st.date = b.dataset.d; st.time = null; stepD(); } };
    $$(".slot").forEach(b => b.onclick = () => { st.time = +b.dataset.t; $$(".slot").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#nx").disabled = false; });
    $("#nx").onclick = () => { if (re) return finish(); st.step = 3; draw(); };
  }
  function stepF() {
    const u = S.user || {};
    $("#abody").innerHTML = `${summary()}<div style="margin-bottom:12px">${back()}</div>
      <form class="card" id="fd" novalidate style="max-width:640px">
        ${S.user ? `<div class="alert ok" style="margin-bottom:16px">${I("check")}<div class="small">Dados preenchidos a partir da sua área pessoal.</div></div>` : `<div class="alert info" style="margin-bottom:16px">${I("user")}<div class="small">Tem conta? <a href="#/conta">Entre</a> para preencher automaticamente e gerir as marcações.</div></div>`}
        <div class="field"><label class="f" for="fn">Nome completo</label><input class="inp" id="fn" autocomplete="name" value="${esc(u.nome || "")}" required></div>
        <div class="grid g2"><div class="field"><label class="f" for="fe">E-mail</label><input class="inp" id="fe" type="email" autocomplete="email" value="${esc(u.email || "")}" required></div>
        <div class="field"><label class="f" for="fp">Telemóvel</label><input class="inp" id="fp" type="tel" inputmode="tel" autocomplete="tel" placeholder="9xx xxx xxx" value="${esc(u.tel || "")}"><p class="hint">Para o lembrete por SMS (opcional).</p></div></div>
        <div class="field"><label class="f" for="fo">Observações <span class="muted">(opcional)</span></label><textarea class="inp" id="fo" placeholder="Ex.: preciso de acessibilidade, venho acompanhado…"></textarea></div>
        <label class="check"><input type="checkbox" id="fc"><span class="small">Autorizo o tratamento dos meus dados para gestão desta marcação, nos termos da política de privacidade.</span></label>
        <div id="ferr" class="err" role="alert"></div>
        <button class="btn pri block" style="margin-top:12px">${I("check")}Confirmar marcação</button>
      </form>`;
    bindBack();
    $("#fd").onsubmit = e => {
      e.preventDefault(); const er = [];
      if ($("#fn").value.trim().length < 3) er.push("Indique o seu nome.");
      if (!/^\S+@\S+\.\S+$/.test($("#fe").value)) er.push("Indique um e-mail válido.");
      if ($("#fp").value && !/^9\d{8}$/.test($("#fp").value.replace(/\s/g, ""))) er.push("O telemóvel deve ter 9 dígitos e começar por 9.");
      if (!$("#fc").checked) er.push("É necessário aceitar o tratamento de dados.");
      $("#ferr").innerHTML = er.join("<br>"); if (er.length) return;
      finish({ nome: $("#fn").value.trim(), email: $("#fe").value.trim(), tel: $("#fp").value.trim(), obs: $("#fo").value.trim() });
    };
  }
  function finish(data) {
    let b;
    if (re) { Object.assign(re, { date: st.date, time: st.time, loja: st.loja }); b = re; }
    else { b = { id: code("RIAC-"), servico: st.servico, loja: st.loja, date: st.date, time: st.time, status: "confirmada", created: Date.now(), ...data }; S.bookings.unshift(b); }
    save(); st.step = 4; $$("#stp li").forEach((li, i) => li.className = i < 4 ? "done" : "on");
    const l = lojaById(b.loja), sv = svcById(b.servico);
    $("#abody").innerHTML = `<div class="card" style="text-align:center;padding:36px 24px;max-width:640px;margin:0 auto">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--green-50);color:var(--green);display:grid;place-items:center;margin:0 auto 14px">${I("check")}</div>
      <h2>${re ? "Marcação alterada" : "Marcação confirmada"}</h2><p class="muted">Enviámos a confirmação para ${esc(b.email || "o seu e-mail")}.<br><span class="xs">(Simulação — nada é enviado.)</span></p>
      <div class="card" style="text-align:left;background:var(--surface-2);border:0;margin:18px 0"><dl class="kv"><dt>Referência</dt><dd>${b.id}</dd><dt>Serviço</dt><dd>${esc(sv.nome)}</dd><dt>Quando</dt><dd>${fmtDate(parseYmd(b.date))}, ${fmtMin(b.time)}</dd><dt>Onde</dt><dd>${esc(l.nome)}<br><span class="small muted">${esc(l.morada)}, ${l.cp} ${esc(l.local)}</span></dd></dl></div>
      <div class="row" style="justify-content:center"><button class="btn pri" id="ic">${I("download","sm")}Adicionar ao calendário</button><a class="btn sec" href="#/servico/${sv.id}">${I("doc","sm")}Ver documentos necessários</a><a class="btn ghost" href="#/conta">As minhas marcações</a></div>
      <p class="xs muted" style="margin-top:16px">Chegue 5 minutos antes. Pode alterar ou cancelar até 2 horas antes na sua área pessoal.</p></div>`;
    $("#ic").onclick = () => ics(b);
  }
  draw();
}

let leafletP = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(c);
    const s = document.createElement("script"); s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s);
    setTimeout(() => rej(new Error("timeout")), 9000);
  });
  return leafletP;
}
const pinIcon = (sel) => window.L.divIcon({ className: "", html: `<div style="width:${sel ? 30 : 22}px;height:${sel ? 30 : 22}px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${sel ? "#122033" : "#0b5574"};border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>`, iconSize: [26, 26], iconAnchor: [13, 26] });

    <div class="grid" style="grid-template-columns:1fr 200px auto;gap:12px;margin-bottom:12px" id="lf">
      <input class="inp" id="lt" type="search" placeholder="Pesquisar por localidade ou nome" aria-label="Pesquisar lojas">
      ${islandSelect("li", st.isl, true)}

    </div>

    <div class="mapwrap" style="margin-bottom:40px"><div><p class="small muted" id="lc" aria-live="polite"></p><div class="storelist" id="ls"></div></div><div id="map" role="region" aria-label="Mapa das lojas"></div></div></div>`;
  let map, markers = {}, pos = null;

    let ls = LOJAS.filter(l => (!st.isl || l.ilha === st.isl) && (!st.txt || norm(l.nome + l.local + l.morada).includes(norm(st.txt))) && (!st.open || openStatus(l).open) && (!st.riae || l.riae));

  };

    if (map) {
      Object.entries(markers).forEach(([id, m]) => { const show = ls.some(l => l.id === id); show ? m.addTo(map) : m.remove(); });

  $("#lt").oninput = e => { st.txt = e.target.value; draw(); };
  $("#li").onchange = e => { st.isl = e.target.value; draw(); };

  $("#lr").onclick = e => { st.riae = !st.riae; e.target.setAttribute("aria-pressed", st.riae); draw(); };
  $("#lloc").onclick = () => locate(p => { pos = p; draw(); });
  $("#ls").addEventListener("mouseover", e => { const a = e.target.closest("[data-id]"); if (a && markers[a.dataset.id]) Object.entries(markers).forEach(([id, m]) => m.setIcon(pinIcon(id === a.dataset.id))); });
  draw();

    if (!$("#map")) return;
    map = window.L.map("map", { scrollWheelZoom: false }).setView([38.5, -28], 7);

  }).catch(() => { const m = $("#map"); if (m) m.innerHTML = `<div class="empty" style="height:100%;display:grid;place-items:center">O mapa precisa de ligação à internet.</div>`; });

let chatOpen = false;
function toggleChat(force) {
  chatOpen = typeof force === "boolean" ? force : !chatOpen;
  let c = $("#chat");
  if (!chatOpen) { c && c.remove(); $("#fab").setAttribute("aria-expanded", "false"); return; }
  if (c) return;
  document.body.insertAdjacentHTML("beforeend", `<section class="chat" id="chat" role="dialog" aria-label="Assistente RIAC">
    <header><span class="brand"><span class="mark" style="width:30px;height:30px">${I("chat","sm")}</span></span><div style="flex:1"><b>Assistente RIAC</b><br><span class="xs muted">Demonstração · respostas automáticas</span></div><button class="btn ghost sm" id="chx" aria-label="Fechar">${I("x")}</button></header>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form id="chf"><input id="chi" placeholder="Escreva a sua pergunta" aria-label="Mensagem" autocomplete="off"><button class="btn pri" aria-label="Enviar">${I("arrow")}</button></form></section>`);
  $("#fab").setAttribute("aria-expanded", "true");
  $("#chx").onclick = () => toggleChat(false);
  bot("Olá! Sou o assistente da RIAC. Em que posso ajudar?", [["Tirar senha", "q:Quero tirar senha"], ["Marcar atendimento", "q:Quero marcar atendimento"], ["Preço do Cartão de Cidadão", "q:Quanto custa o cartão de cidadão?"], ["Horário da Linha Verde", "q:Horário da linha verde"]]);
  $("#chf").onsubmit = e => { e.preventDefault(); const v = $("#chi").value.trim(); if (!v) return; $("#chi").value = ""; ask(v); };
  $("#msgs").onclick = e => { const b = e.target.closest("[data-q]"); if (b) ask(b.dataset.q); const a = e.target.closest("a[href^='#']"); if (a && innerWidth < 640) toggleChat(false); };
  $("#chi").focus();
}
function bot(text, acts = []) {
  const m = $("#msgs"); if (!m) return;
  m.insertAdjacentHTML("beforeend", `<div class="msg bot">${text}${acts.length ? `<div class="acts">${acts.map(([l, h]) => h.startsWith("q:") ? `<button class="chip" data-q="${esc(h.slice(2))}">${l}</button>` : `<a class="chip" href="${h}">${l}</a>`).join("")}</div>` : ""}</div>`);
  m.scrollTop = m.scrollHeight;
}
function ask(v) {
  $("#msgs").insertAdjacentHTML("beforeend", `<div class="msg me">${esc(v)}</div>`);
  const n = norm(v);
  setTimeout(() => {
    if (/senha|fila|espera/.test(n)) return bot("Pode tirar a senha digital agora e acompanhar a fila no telemóvel. Avisamos quando faltarem 3 pessoas.", [["Tirar senha", "#/senha"], ["Ver espera nas lojas", "#/lojas"]]);
    if (/marc|agend|hora marcada/.test(n)) return bot("Marque em 4 passos: serviço, loja, dia e hora. Recebe confirmação e lembrete.", [["Marcar atendimento", "#/agendar"]]);
    if (/cartao.*cidad|\bcc\b/.test(n) && /cust|preco|quanto|valor/.test(n)) return bot("O Cartão de Cidadão custa <b>15 €</b> até aos 25 anos e <b>18 €</b> depois dos 25 (pedido normal). O pedido urgente custa 30 €/33 € e o extremamente urgente 50 €/53 €. O primeiro pedido de bebés até 1 ano é gratuito.", [["Calcular o meu caso", "#/servico/cartao-cidadao"], ["Marcar", "#/agendar?servico=cartao-cidadao"]]);
    if (/linha verde|telefone|ligar|800/.test(n)) return bot(`A Linha Verde <b>800 500 501</b> é gratuita: segunda a sábado das 09h00 às 22h00, domingo das 10h00 às 22h00 e feriados das 10h00 às 18h00. Neste momento está ${lineStatus().open ? "<b>disponível</b>" : "<b>fechada</b>"}.`, [["Pedir que liguemos", "#/contactos"]]);
    if (/horario|aberta|abre|fecha|loja|perto/.test(n)) return bot("A maioria das lojas abre de segunda a sexta, das 09h00 às 12h00 e das 13h00 às 16h30. A RIAC Parque Atlântico (Ponta Delgada) abre todos os dias, até às 22h00 durante a semana.", [["Lojas abertas agora", "#/lojas"]]);
    if (/pedido|estado|acompanh/.test(n)) return bot("Pode acompanhar todos os seus pedidos na área pessoal, com o estado atualizado passo a passo.", [["Área pessoal", "#/conta?tab=pedidos"]]);
    if (/pagar|eda|eletricidade|luz/.test(n)) return bot("Pode pagar a fatura da EDA online ou numa loja RIAC, sem custos adicionais.", [["Pagar fatura", "#/pagamentos"]]);
    const r = searchSvc(v).slice(0, 3);
    if (r.length) return bot("Encontrei estes serviços:", r.map(s => [s.nome.replace(/ \(.*\)/, ""), "#/servico/" + s.id]));
    bot("Não tenho a certeza de ter percebido. Pode reformular, ou falar com um assistente pela Linha Verde 800 500 501 (gratuita).", [["Ver todos os serviços", "#/servicos"], ["Contactos", "#/contactos"]]);
  }, 350);
}

chrome();
route();
</script>
